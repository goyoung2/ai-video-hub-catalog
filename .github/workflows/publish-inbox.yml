name: Publish public catalog updates
on:
  push:
    branches: [main]
    paths:
      - 'feeds/inbox/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-catalog-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate proposals
        run: npm run check && npm test
      - name: Merge changes
        run: npm run publish
      - name: Commit published feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(feed): publish checked proposals'
            git push origin HEAD:main
          fi
